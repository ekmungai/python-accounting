[project]
name = "python-accounting"
version = "1.1.0"
description = "The world's most comprehensive python Double Entry Accounting Library"
authors = [{ name = "Edward Mungai", email = "emungai@microbooks.io" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy (>=2.1.4,<2.2)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "mysqlclient (>=2.3.0,<3.0.0)",
    "psycopg2 (>=2.9.13,<3.0.0)",
]

[tool.poetry]
packages = [{include = "python_accounting"}, {include = "config.toml"}]

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"

[tool.poetry.group.dev.dependencies]
sphinx-autoapi = "^3.8.1"
sphinx-rtd-theme = "^3.1.0"
sphinx = "^9.0.4"
myst-parser = "^5.1.0"
pylint = "^4.1.3"
tox = "^4.66.0"
dill = "^0.4.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
